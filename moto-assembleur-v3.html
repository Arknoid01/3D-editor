    background: rgba(10,12,16,.78); border: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(0,0,0,.45);
  }
  .vue-controles .vide { pointer-events: none; }
  .vue-controles .gizmo-btn { font-size: 16px; font-weight: 700; }
  .etages-controles {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    pointer-events: auto; padding: 6px; border-radius: 10px;
    background: rgba(10,12,16,.78); border: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(0,0,0,.45);
  }
  .etages-nav { display: flex; gap: 6px; align-items: center; }
  .etages-nav .gizmo-btn { width: 36px; height: 28px; font-size: 13px; }
  .etages-grille {
    display: grid; grid-template-columns: repeat(3, 32px); gap: 3px;
  }
  .etages-grille .etage-cell {
    width: 32px; height: 26px; font-size: 10px; font-weight: 600;
    letter-spacing: 0.02em;
  }
  .etages-grille .etage-cell.actif {
    background: rgba(0,217,255,.22); border-color: var(--cyan); color: var(--cyan);
  }
  .gizmo-etage-label {
    font-size: 10px; color: var(--text-dim); text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .gizmo-axes-rotation { display: none; flex-wrap: wrap; gap: 6px; pointer-events: auto; margin-top: 4px; }
  .gizmo-axes-rotation.visible { display: flex; }
  .gizmo-axes-rotation .gizmo-btn { min-width: 32px; font-size: 12px; font-weight: 700; }
  .ligne-rot { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
  .ligne-rot input[type=range] { flex: 1; }
  .ligne-rot .axe { width: 14px; font-weight: 700; color: var(--cyan); }
  #editionPiece .edition-controles { display: none; }
  #editionPiece.selection-active .edition-controles { display: block; }
  #editionPiece.selection-active .edition-vide { display: none; }
  @media (min-width: 769px) {
    header .credit { display: block; }
    #panel { position: relative; z-index: 1; }
  }
  @media (max-width: 768px) {
    #btnMenu { display: block; }
    #panelOverlay { display: block; }
    #panel {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 30;
      transform: translateX(100%); transition: transform .28s ease;
      box-shadow: -8px 0 32px rgba(0,0,0,.45);
    }
    #panel.ouvert { transform: translateX(0); }
    header .credit { display: none; }
    #hint { font-size: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="btnMenu" type="button" aria-label="Ouvrir le menu" aria-expanded="false"><span></span></button>
    <h1>Assembleur Moto</h1>
    <span class="credit">Poly by Google (CC-BY 3.0)</span>
  </header>
  <div id="main">
    <div id="viewport">
      <div id="loading">Chargement du modèle…</div>
      <div id="hint">glisser = tourner · pincer = zoom · tap ailleurs = désélectionner</div>
      <div id="gizmoHud" aria-hidden="true">
        <span class="gizmo-titre" id="gizmoTitre">Édition</span>
        <div class="gizmo-cross">
          <span class="vide"></span>
          <button type="button" class="gizmo-btn" data-mode="move" title="Déplacer">✥</button>
          <span class="vide"></span>
          <button type="button" class="gizmo-btn" data-mode="rotate" title="Pivoter">↻</button>
          <span class="vide" style="display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--cyan);">+</span>
          <button type="button" class="gizmo-btn" data-mode="scale" title="Redimensionner">⤢</button>
          <span class="vide"></span>
          <span class="vide"></span>
          <span class="vide"></span>
        </div>
        <div class="gizmo-axes-rotation" id="gizmoAxesRotation">
          <button type="button" class="gizmo-btn actif" data-axe="y" title="Axe vertical (Y)">Y</button>
          <button type="button" class="gizmo-btn" data-axe="x" title="Axe horizontal — basculer avant/arrière (X)">X</button>
          <button type="button" class="gizmo-btn" data-axe="z" title="Axe horizontal — roulis gauche/droite (Z)">Z</button>
        </div>
        <div class="gizmo-actions">
          <button type="button" class="gizmo-btn" id="btnColler" title="Coller sur la moto">Coller</button>
          <button type="button" class="gizmo-btn" id="btnFlotter" title="Laisser flotter">Flotter</button>
        </div>
        <span class="gizmo-titre">Vue</span>
        <div class="vue-controles">
          <span class="vide"></span>
          <button type="button" class="gizmo-btn" data-vue="up" title="Vue vers le haut">↑</button>
          <span class="vide"></span>
          <button type="button" class="gizmo-btn" data-vue="left" title="Tourner à gauche">←</button>
          <button type="button" class="gizmo-btn" data-vue="down" title="Vue vers le bas">↓</button>
          <button type="button" class="gizmo-btn" data-vue="right" title="Tourner à droite">→</button>
        </div>
        <span class="gizmo-titre">Hauteur</span>
        <div class="etages-controles">
          <div class="etages-nav">
            <button type="button" class="gizmo-btn" id="btnEtageUp" title="Monter d'un étage">▲</button>
            <span class="gizmo-etage-label" id="etageLabel">Étage 0</span>
            <button type="button" class="gizmo-btn" id="btnEtageDown" title="Descendre d'un étage">▼</button>
          </div>
          <div class="etages-grille" id="etagesGrille"></div>
        </div>
      </div>
    </div>
    <div id="panelOverlay" aria-hidden="true"></div>
    <aside id="panel" aria-label="Options de personnalisation"></aside>
  </div>
</div>

<script src="assembler-engine.js"></script>
<script>
// ---------------------------------------------------------------------
// Config UI & pièces
// ---------------------------------------------------------------------
const SECTIONS_UI = [
  { id: 'presets', titre: 'Presets', ouverte: true },
  { id: 'couleurs', titre: 'Couleurs carrosserie', ouverte: true },
  { id: 'aero', titre: 'Aérodynamique', ouverte: false },
  { id: 'carrosserie', titre: 'Carrosserie & rangement', ouverte: false },
  { id: 'mecanique', titre: 'Mécanique', ouverte: false },
  { id: 'eclairage', titre: 'Éclairage & néons', ouverte: false },
  { id: 'details', titre: 'Détails & rétros', ouverte: false },
  { id: 'ailes', titre: 'Ailes avion & oiseau', ouverte: true },
  { id: 'formes', titre: 'Formes & déco libre', ouverte: false },
  { id: 'edition', titre: 'Édition pièce', ouverte: true },
  { id: 'reglages', titre: 'Réglages & export', ouverte: false },
];

let ADDONS_CATALOG = [];

function couleurHexCatalog(catalog, colorKey) {
  return catalog.colors[colorKey] || colorKey || '#888899';
}

function buildAddonsCatalog(catalog) {
  return Object.values(catalog.parts).map(p => ({
    id: p.id,
    section: p.section || 'details',
    label: p.name,
    color: couleurHexCatalog(catalog, p.defaultColor),
    emissive: !!p.emissive,
  }));
}

const COULEURS_CARROSSERIE = [
  { id: 'rouge', label: 'Zones rouges', value: '#cc2222' },
  { id: 'blanc', label: 'Zones blanches', value: '#f0f0f0' },
  { id: 'noir', label: 'Zones noires', value: '#1a1a1a' },
  { id: 'chrome', label: 'Détails métal', value: '#888899' },
];

// ---------------------------------------------------------------------
// Construction du panneau (tuiles rétractables)
// ---------------------------------------------------------------------
function construirePanneau() {
  const panel = document.getElementById('panel');
  panel.innerHTML = '';

  const searchBar = document.createElement('div');
  searchBar.className = 'panel-search';
  searchBar.innerHTML = '<input type="search" id="filtrePieces" placeholder="Rechercher une pièce (aile, néon…)" autocomplete="off">';
  panel.appendChild(searchBar);

  SECTIONS_UI.forEach(sec => {
    const tuile = document.createElement('div');
    tuile.className = 'tuile' + (sec.ouverte ? ' ouverte' : '');
    tuile.dataset.section = sec.id;

    const titre = document.createElement('button');
    titre.type = 'button';
    titre.className = 'tuile-titre';
    titre.innerHTML = sec.titre + '<span class="chevron" aria-hidden="true"></span>';
    titre.addEventListener('click', () => tuile.classList.toggle('ouverte'));
    tuile.appendChild(titre);

    const contenu = document.createElement('div');
    contenu.className = 'tuile-contenu';

    if (sec.id === 'presets') {
      contenu.innerHTML = `
        <p class="note">Configs prédéfinies et sauvegardes locales (localStorage).</p>
        <div id="presetsListe"></div>
        <div class="champ" style="margin-top:12px;">
          <label>Nom de la sauvegarde</label>
          <input type="text" id="presetNom" placeholder="Ma moto néon">
          <button type="button" class="btn-action secondaire" id="btnSavePreset" style="margin-top:8px;">Sauvegarder la config actuelle</button>
        </div>`;
    } else if (sec.id === 'couleurs') {
      contenu.innerHTML = '<p class="note">Chaque zone de la texture est recolorée indépendamment (rouge, blanc, noir, métal).</p>';
      COULEURS_CARROSSERIE.forEach(c => {
        const ligne = document.createElement('div');
        ligne.className = 'ligne-couleur';
        ligne.innerHTML = '<span class="nom">' + c.label + '</span><input type="color" id="col-' + c.id + '" value="' + c.value + '">';
        contenu.appendChild(ligne);
      });
    } else if (sec.id === 'edition') {
      contenu.innerHTML = `
        <div id="editionPiece">
          <p class="note edition-vide">Sélectionnez une pièce dans la liste ou touchez-la sur la moto.</p>
          <div class="edition-controles">
            <p class="note" id="editionNom"></p>
            <div class="champ">
              <label>Mode</label>
              <span class="val" id="editionMode">—</span>
            </div>
            <div class="champ">
              <label>Taille individuelle <span class="val" id="v-taillePiece">1</span></label>
              <input type="range" id="taillePiece" min="0.3" max="2.5" step="0.05" value="1">
            </div>
            <div class="champ">
              <label>Rotation par axe</label>
              <div class="ligne-rot"><span class="axe">X</span><input type="range" id="rotX" min="-3.14" max="3.14" step="0.05" value="0"><span class="val" id="v-rotX">0°</span></div>
              <div class="ligne-rot"><span class="axe">Y</span><input type="range" id="rotY" min="-3.14" max="3.14" step="0.05" value="0"><span class="val" id="v-rotY">0°</span></div>
              <div class="ligne-rot"><span class="axe">Z</span><input type="range" id="rotZ" min="-3.14" max="3.14" step="0.05" value="0"><span class="val" id="v-rotZ">0°</span></div>
            </div>
            <div class="historique-btns">
              <button type="button" class="btn-action secondaire" id="btnUndo" disabled title="Ctrl+Z">↶ Annuler</button>
              <button type="button" class="btn-action secondaire" id="btnRedo" disabled title="Ctrl+Y">↷ Refaire</button>
            </div>
            <div class="champ">
              <label style="cursor:pointer;"><input type="checkbox" id="snapRotation" checked style="width:auto;margin-right:6px;"> Snap rotation 15°</label>
            </div>
            <button type="button" class="btn-action secondaire" id="btnMiroir">Dupliquer miroir G ↔ D</button>
            <button type="button" class="btn-action secondaire" id="btnCollerPanel">Coller sur la moto</button>
            <button type="button" class="btn-action secondaire" id="btnFlotterPanel">Laisser flotter</button>
            <button type="button" class="btn-action secondaire" id="btnResetPiece">Réinitialiser position</button>
          </div>
        </div>`;
    } else if (sec.id === 'reglages') {
      contenu.innerHTML = `
        <div class="champ">
          <label>Taille des pièces <span class="val" id="v-echelleAddons">1</span></label>
          <input type="range" id="echelleAddons" min="0.5" max="1.8" step="0.05" value="1">
        </div>
        <div class="champ" style="margin-top:14px;">
          <label>Nom du fichier</label>
          <input type="text" id="nomFichier" value="ma-moto-custom">
        </div>
        <button class="btn-action" id="btnExport" disabled>Exporter en .glb</button>`;
    } else {
      ADDONS_CATALOG.filter(a => a.section === sec.id).forEach(a => {
        const ligne = document.createElement('div');
        ligne.className = 'ligne-addon';
        ligne.dataset.addonId = a.id;
        ligne.innerHTML = '<input type="checkbox" id="chk-' + a.id + '"><button type="button" class="btn-select" data-select="' + a.id + '" title="Sélectionner">✥</button><span class="nom">' + a.label + '</span><input type="color" id="col-' + a.id + '" value="' + a.color + '">';
        contenu.appendChild(ligne);
      });
    }

    tuile.appendChild(contenu);
    panel.appendChild(tuile);
  });

  COULEURS_CARROSSERIE.forEach(c => {
    document.getElementById('col-' + c.id).addEventListener('input', appliquerCouleursCarrosserie);
  });
  ADDONS_CATALOG.forEach(a => {
    const chk = document.getElementById('chk-' + a.id);
    const col = document.getElementById('col-' + a.id);
    const sel = document.querySelector('[data-select="' + a.id + '"]');
    if (chk) chk.addEventListener('change', () => { enregistrerHistorique(); rafraichirAddons(); if (chk.checked) selectionnerPiece(a.id); });
    if (col) { col.addEventListener('input', rafraichirAddons); col.addEventListener('change', enregistrerHistorique); }
    if (sel) sel.addEventListener('click', (e) => { e.stopPropagation(); selectionnerPiece(a.id); });
  });
  document.getElementById('echelleAddons').addEventListener('input', () => {
    document.getElementById('v-echelleAddons').textContent = document.getElementById('echelleAddons').value;
    rafraichirAddons();
  });
  document.getElementById('btnExport').addEventListener('click', exporterGlb);
  document.getElementById('taillePiece').addEventListener('input', () => {
    if (!pieceSelectionnee) return;
    const addon = addons[pieceSelectionnee];
    addon.scaleMul = parseFloat(document.getElementById('taillePiece').value);
    document.getElementById('v-taillePiece').textContent = document.getElementById('taillePiece').value;
    rafraichirAddons();
  });
  document.getElementById('btnCollerPanel').addEventListener('click', () => {
    if (pieceSelectionnee) activerColle(pieceSelectionnee, true);
  });
  document.getElementById('btnFlotterPanel').addEventListener('click', () => {
    if (pieceSelectionnee) activerColle(pieceSelectionnee, false);
  });
  document.getElementById('btnResetPiece').addEventListener('click', () => {
    if (pieceSelectionnee) { enregistrerHistorique(); reinitialiserPiece(pieceSelectionnee); }
  });
  document.getElementById('filtrePieces').addEventListener('input', (e) => filtrerPieces(e.target.value));
  document.getElementById('btnUndo').addEventListener('click', annuler);
  document.getElementById('btnRedo').addEventListener('click', refaire);
  document.getElementById('btnMiroir').addEventListener('click', dupliquerMiroir);
  document.getElementById('btnSavePreset').addEventListener('click', () => {
    const nom = (document.getElementById('presetNom').value || '').trim();
    if (!nom) return;
    sauvegarderPresetLocal(nom);
    document.getElementById('presetNom').value = '';
  });
  remplirPresets();
}

function filtrerPieces(query) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll('.ligne-addon').forEach(l => {
    const id = l.dataset.addonId || '';
    const def = ADDONS_CATALOG.find(a => a.id === id);
    const label = (def ? def.label : id).toLowerCase();
    const match = !q || label.includes(q) || id.toLowerCase().includes(q);
    l.classList.toggle('cachee', !match);
  });
  document.querySelectorAll('.tuile').forEach(t => {
    const sec = t.dataset.section;
    if (['presets', 'couleurs', 'edition', 'reglages'].includes(sec)) return;
    const anyVisible = t.querySelector('.ligne-addon:not(.cachee)');
    t.classList.toggle('tuile-cachee', !!q && !anyVisible);
  });
}

// ---------------------------------------------------------------------
// Menu hamburger (mobile)
// ---------------------------------------------------------------------
const btnMenu = document.getElementById('btnMenu');
const panelEl = document.getElementById('panel');
const panelOverlay = document.getElementById('panelOverlay');

function setPanelOuvert(ouvert) {
  panelEl.classList.toggle('ouvert', ouvert);
  panelOverlay.classList.toggle('visible', ouvert);
  btnMenu.classList.toggle('actif', ouvert);
  btnMenu.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
  panelOverlay.setAttribute('aria-hidden', ouvert ? 'false' : 'true');
}

btnMenu.addEventListener('click', () => setPanelOuvert(!panelEl.classList.contains('ouvert')));
panelOverlay.addEventListener('click', () => setPanelOuvert(false));
window.addEventListener('resize', () => { if (window.innerWidth > 768) setPanelOuvert(false); });

// ---------------------------------------------------------------------
// Scène
// ---------------------------------------------------------------------
const viewport = document.getElementById('viewport');
const loadingEl = document.getElementById('loading');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c10);
scene.fog = new THREE.Fog(0x0a0c10, 5, 14);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
viewport.appendChild(renderer.domElement);

function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

scene.add(new THREE.AmbientLight(0x334455, 1.3));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(3, 4, 2);
scene.add(key);
const rim = new THREE.DirectionalLight(0x00d9ff, 0.6);
rim.position.set(-3, 2, -2);
scene.add(rim);

const ETAGE_COUNT = 6;
const ETAGE_STEP = 0.18;
let etagesY = [];
let grillesEtages = [];
const groupeEtages = new THREE.Group();
groupeEtages.visible = false;
scene.add(groupeEtages);

function initialiserEtages() {
  while (groupeEtages.children.length) groupeEtages.remove(groupeEtages.children[0]);
  grillesEtages = [];
  etagesY = [];
  const baseY = bikeBounds ? bikeBounds.min.y : 0;
  for (let i = 0; i < ETAGE_COUNT; i++) {
    etagesY.push(baseY + i * ETAGE_STEP);
    const grid = new THREE.GridHelper(10, 20, 0x1f2733, 0x161b22);
    grid.position.y = etagesY[i];
    const mats = Array.isArray(grid.material) ? grid.material : [grid.material];
    mats.forEach(m => { m.transparent = true; m.opacity = 0.1; });
    groupeEtages.add(grid);
    grillesEtages.push(grid);
  }
}

function etageLePlusProche(y) {
  let meilleur = 0, dist = Infinity;
  etagesY.forEach((ey, i) => {
    const d = Math.abs(y - ey);
    if (d < dist) { dist = d; meilleur = i; }
  });
  return meilleur;
}

function etageY(index) {
  const i = Math.max(0, Math.min(ETAGE_COUNT - 1, index));
  return etagesY[i] !== undefined ? etagesY[i] : 0;
}

function mettreAJourGrillesEtages(etageActif) {
  grillesEtages.forEach((grid, i) => {
    const actif = i === etageActif;
    const mats = Array.isArray(grid.material) ? grid.material : [grid.material];
    mats.forEach(m => {
      m.transparent = true;
      m.opacity = actif ? 0.42 : 0.08;
      m.color.setHex(actif ? 0x00d9ff : 0x1f2733);
    });
  });
}

function mettreAJourHudEtage() {
  if (!pieceSelectionnee || !addons[pieceSelectionnee]) return;
  const etage = addons[pieceSelectionnee].etage || 0;
  document.getElementById('etageLabel').textContent = 'Étage ' + etage;
  document.querySelectorAll('.etage-cell').forEach(btn => {
    btn.classList.toggle('actif', parseInt(btn.dataset.etage, 10) === etage);
  });
  mettreAJourGrillesEtages(etage);
  groupeEtages.visible = true;
}

function definirEtagePiece(index) {
  if (!pieceSelectionnee) return;
  const addon = addons[pieceSelectionnee];
  addon.etage = Math.max(0, Math.min(ETAGE_COUNT - 1, index));
  addon.pivot.position.y = etageY(addon.etage);
  addon.colle = false;
  addon.flotter = true;
  mettreAJourHudColle();
  mettreAJourHudEtage();
  mettreAJourHelperSelection();
}

function deplacerPieceEtage(delta) {
  if (!pieceSelectionnee) return;
  const addon = addons[pieceSelectionnee];
  definirEtagePiece((addon.etage || 0) + delta);
}

function construireGrilleEtagesUI() {
  const conteneur = document.getElementById('etagesGrille');
  conteneur.innerHTML = '';
  for (let i = ETAGE_COUNT - 1; i >= 0; i--) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'gizmo-btn etage-cell';
    btn.dataset.etage = String(i);
    btn.title = 'Étage ' + i;
    btn.textContent = 'E' + i;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (pieceSelectionnee) definirEtagePiece(i);
    });
    conteneur.appendChild(btn);
  }
}
construireGrilleEtagesUI();
document.getElementById('btnEtageUp').addEventListener('click', (e) => { e.stopPropagation(); deplacerPieceEtage(1); });
document.getElementById('btnEtageDown').addEventListener('click', (e) => { e.stopPropagation(); deplacerPieceEtage(-1); });

scene.add(new THREE.GridHelper(10, 20, 0x1f2733, 0x161b22));

let draggingCamera = false, lastX = 0, lastY = 0;
let camAngleY = 0.7, camAngleX = 0.3, camDist = 3.6;
let pinchDist = 0;

// Sélection & transformation des pièces
const raycaster = new THREE.Raycaster();
const pointeur = new THREE.Vector2();
const planDrag = new THREE.Plane();
const intersectionDrag = new THREE.Vector3();
const offsetDrag = new THREE.Vector3();
let pieceSelectionnee = null;
let modeTransform = null; // 'move' | 'rotate' | 'scale'
let axeRotation = 'y'; // 'x' | 'y' | 'z' — y = vertical, x/z = horizontaux
let dragTransform = false;
let dragStartX = 0, dragStartY = 0;
let valeurDragDepart = null;
let helperSelection = null;

const gizmoHud = document.getElementById('gizmoHud');
const btnColler = document.getElementById('btnColler');
const btnFlotter = document.getElementById('btnFlotter');

function mettreAJourPointeur(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointeur.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointeur.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

function libellePiece(id) {
  const def = ADDONS_CATALOG.find(a => a.id === id);
  return def ? def.label : id;
}

function selectionnerPiece(id) {
  if (!addons[id]) return;
  const chk = document.getElementById('chk-' + id);
  if (chk && !chk.checked) { chk.checked = true; rafraichirAddons(); }
  pieceSelectionnee = id;
  document.querySelectorAll('.ligne-addon').forEach(l => {
    l.classList.toggle('selectionnee', l.dataset.addonId === id);
  });
  document.querySelectorAll('.btn-select').forEach(b => {

function deselectionnerPiece() {

  document.querySelectorAll('.btn-select.actif, .gizmo-btn.actif').forEach(el => el.classList.remove('actif'));

function mettreAJourHelperSelection() {
  if (!pieceSelectionnee || !addons[pieceSelectionnee]) return;
  const pivot = addons[pieceSelectionnee].pivot;

  helperSelection = new THREE.BoxHelper(pivot, 0x00d9ff);

function mettreAJourHudColle() {
  if (!pieceSelectionnee) return;
  const addon = addons[pieceSelectionnee];

function degres(rad) {
  return Math.round(rad * 180 / Math.PI) + '°';
}

function mettreAJourSlidersRotation() {
  if (!pieceSelectionnee || !addons[pieceSelectionnee]) return;
  const r = addons[pieceSelectionnee].pivot.rotation;
  ['X', 'Y', 'Z'].forEach((axe) => {
    const el = document.getElementById('rot' + axe);

    if (el) el.value = val;

function snapAngle(rad) {
  const el = document.getElementById('snapRotation');
  if (!el || !el.checked) return rad;
  const step = 15 * Math.PI / 180;
  return Math.round(rad / step) * step;
}

function appliquerRotationSlider(axe, valeur) {

function pivoterVue(direction) {
  const step = 0.14;
  if (direction === 'left') camAngleY += step;
  if (direction === 'right') camAngleY -= step;
  if (direction === 'up') camAngleX = Math.min(1.0, camAngleX + step);
  if (direction === 'down') camAngleX = Math.max(-0.1, camAngleX - step);
  updateCamera();
}

function activerColle(id, colle) {
  const addon = addons[id];
  if (!addon) return;
  addon.colle = colle;
  addon.flotter = !colle;
  mettreAJourHudColle();
  if (colle) collerSurMoto(addon.pivot);
  mettreAJourHelperSelection();
}

function reinitialiserPiece(id) {
  const addon = addons[id];
  if (!addon) return;
  addon.pivot.position.copy(addon.basePosition);
  addon.pivot.rotation.copy(addon.baseRotation);
  addon.scaleMul = 1;
  addon.colle = true;
  addon.flotter = false;
  addon.etage = etageLePlusProche(addon.basePosition.y);
  mettreAJourHudColle();
  rafraichirAddons();
  collerSurMoto(addon.pivot);
  mettreAJourHelperSelection();
  mettreAJourSlidersRotation();
}

function collerSurMoto(pivot) {
  if (!bikeMeshes.length) return;
  const pos = new THREE.Vector3();
  pivot.getWorldPosition(pos);
  const centre = bikeBounds.getCenter(new THREE.Vector3());
  const directions = [
    centre.clone().sub(pos),
    new THREE.Vector3(0, -1, 0),
    new THREE.Vector3(0, 1, 0),
    new THREE.Vector3(1, 0, 0), new THREE.Vector3(-1, 0, 0),
    new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, -1),
  ];
  let meilleur = null;
  let meilleureDist = Infinity;
  directions.forEach(dir => {
    if (dir.lengthSq() < 1e-6) return;
    dir.normalize();
    for (let t = 0; t < 2; t++) {
      const origine = t === 0 ? pos.clone() : pos.clone().add(dir.clone().multiplyScalar(-0.05));
      raycaster.set(origine, dir);
      const hits = raycaster.intersectObjects(bikeMeshes, true);
      if (!hits.length) continue;
      const hit = hits[0];
      if (hit.distance < meilleureDist) { meilleureDist = hit.distance; meilleur = hit; }
    }
  });
  if (!meilleur) return;
  const normale = meilleur.face.normal.clone().transformDirection(meilleur.object.matrixWorld).normalize();
  const cible = meilleur.point.clone().add(normale.multiplyScalar(0.01));
  if (pivot.parent) pivot.parent.worldToLocal(cible);
  pivot.position.copy(cible);
  const addon = Object.values(addons).find(a => a.pivot === pivot);
  if (addon) {
    addon.etage = etageLePlusProche(pivot.position.y);
    mettreAJourHudEtage();
  }
}

function pieceSousPointeur() {
  const meshes = [];
  Object.values(addons).forEach(a => {
    if (a.pivot.visible) meshes.push(a.mesh);
  });
  if (!meshes.length) return null;
  raycaster.setFromCamera(pointeur, camera);
  const hits = raycaster.intersectObjects(meshes, false);
  if (!hits.length) return null;
  const mesh = hits[0].object;
  return Object.keys(addons).find(id => addons[id].mesh === mesh) || null;
}

function demarrerDragTransform(e) {
  dragTransform = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  const addon = addons[pieceSelectionnee];
  valeurDragDepart = {
    position: addon.pivot.position.clone(),
    rotationX: addon.pivot.rotation.x,
    rotationY: addon.pivot.rotation.y,
    rotationZ: addon.pivot.rotation.z,
    scaleMul: addon.scaleMul,
  };
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  planDrag.setFromNormalAndCoplanarPoint(camDir.negate(), addon.pivot.position);
  raycaster.setFromCamera(pointeur, camera);
  if (raycaster.ray.intersectPlane(planDrag, intersectionDrag)) {
    offsetDrag.copy(addon.pivot.position).sub(intersectionDrag);
  }
}

function appliquerDragTransform(e) {
  if (!pieceSelectionnee || !dragTransform) return;
  const addon = addons[pieceSelectionnee];
  mettreAJourPointeur(e);
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if (modeTransform === 'move') {
    raycaster.setFromCamera(pointeur, camera);
    if (raycaster.ray.intersectPlane(planDrag, intersectionDrag)) {
      addon.pivot.position.copy(intersectionDrag.clone().add(offsetDrag));
      addon.etage = etageLePlusProche(addon.pivot.position.y);
      mettreAJourHudEtage();
      if (addon.colle) collerSurMoto(addon.pivot);
    }
  } else if (modeTransform === 'rotate') {
    const sens = 0.01;
    if (axeRotation === 'y') {
      addon.pivot.rotation.y = valeurDragDepart.rotationY + dx * sens;
    } else if (axeRotation === 'x') {
      addon.pivot.rotation.x = valeurDragDepart.rotationX - dy * sens;
    } else if (axeRotation === 'z') {
      addon.pivot.rotation.z = valeurDragDepart.rotationZ + dx * sens;
    }
    mettreAJourSlidersRotation();
  } else if (modeTransform === 'scale') {
    addon.scaleMul = Math.max(0.3, Math.min(2.5, valeurDragDepart.scaleMul - dy * 0.005));
    document.getElementById('taillePiece').value = addon.scaleMul;
    document.getElementById('v-taillePiece').textContent = addon.scaleMul.toFixed(2);
    rafraichirAddons();
  }
  mettreAJourHelperSelection();
}

function mettreAJourGizmoHud() {
  if (!pieceSelectionnee || !addons[pieceSelectionnee] || !addons[pieceSelectionnee].pivot.visible) {
    gizmoHud.classList.remove('visible');
    return;
  }
  gizmoHud.classList.add('visible');
}

function updateCamera() {
  camera.position.x = camDist * Math.sin(camAngleY) * Math.cos(camAngleX);
  camera.position.z = camDist * Math.cos(camAngleY) * Math.cos(camAngleX);
  camera.position.y = camDist * Math.sin(camAngleX) + 0.4;
  camera.lookAt(0, 0.4, 0);
}
updateCamera();

function touchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

viewport.addEventListener('pointerdown', e => {
  if (e.target.closest('#gizmoHud') || e.target.closest('#panel')) return;
  mettreAJourPointeur(e);
  const id = pieceSousPointeur();
  if (id) {
    selectionnerPiece(id);
    if (modeTransform) { demarrerDragTransform(e); e.preventDefault(); return; }
    draggingCamera = false;
    return;
  }
  deselectionnerPiece();
  draggingCamera = true;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointerup', () => {
  if (dragTransform && pieceSelectionnee && modeTransform === 'rotate') {
    const addon = addons[pieceSelectionnee];
    addon.pivot.rotation.x = snapAngle(addon.pivot.rotation.x);
    addon.pivot.rotation.y = snapAngle(addon.pivot.rotation.y);
    addon.pivot.rotation.z = snapAngle(addon.pivot.rotation.z);
    mettreAJourSlidersRotation();
  }
  if (dragTransform) enregistrerHistorique();
  draggingCamera = false;
  dragTransform = false;
  pinchDist = 0;
});
window.addEventListener('pointermove', e => {
  if (dragTransform) { appliquerDragTransform(e); return; }
  if (!draggingCamera) return;
  camAngleY -= (e.clientX - lastX) * 0.008;
  camAngleX = Math.max(-0.1, Math.min(1.0, camAngleX + (e.clientY - lastY) * 0.006));
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
viewport.addEventListener('wheel', e => {
  camDist = Math.max(1.5, Math.min(9, camDist + e.deltaY * 0.003));
  updateCamera();
  e.preventDefault();
}, { passive: false });
viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 2) { pinchDist = touchDist(e.touches); e.preventDefault(); }
}, { passive: false });
viewport.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchDist > 0) {
    const d = touchDist(e.touches);
    camDist = Math.max(1.5, Math.min(9, camDist + (pinchDist - d) * 0.008));
    pinchDist = d;
    updateCamera();
    e.preventDefault();
  }
}, { passive: false });

// ---------------------------------------------------------------------
// Couleurs carrosserie par zone
// ---------------------------------------------------------------------
function hexVersRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
}

function classerPixel(r, g, b) {
  const luma = 0.299 * r + 0.587 * g + 0.114 * b;
  const maxC = Math.max(r, g, b), minC = Math.min(r, g, b);
  const sat = maxC - minC;
  if (luma < 0.16) return 'noir';
  if (sat < 0.13 && luma > 0.52) return 'blanc';
  if (r > g + 0.07 && r > b + 0.07 && r > 0.22) return 'rouge';
  return 'chrome';
}

function recolorerPixel(r, g, b, cible) {
  const luma = 0.299 * r + 0.587 * g + 0.114 * b;
  const [tr, tg, tb] = hexVersRgb(cible);
  const tl = 0.299 * tr + 0.587 * tg + 0.114 * tb;
  if (tl < 0.001) return [luma, luma, luma];
  const s = luma / tl;
  return [Math.min(1, tr * s), Math.min(1, tg * s), Math.min(1, tb * s)];
}

function appliquerCouleursCarrosserie() {
  if (!pixelsOriginaux || !bikeMeshes.length) return;
  const couleurs = {};
  COULEURS_CARROSSERIE.forEach(c => {
    couleurs[c.id] = document.getElementById('col-' + c.id).value;
  });
  const data = new Uint8ClampedArray(pixelsOriginaux);
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
    const zone = classerPixel(r, g, b);
    const [nr, ng, nb] = recolorerPixel(r, g, b, couleurs[zone]);
    data[i] = Math.round(nr * 255);
    data[i + 1] = Math.round(ng * 255);
    data[i + 2] = Math.round(nb * 255);
  }
  if (!textureRecolor) {
    textureRecolor = new THREE.DataTexture(data, textureLargeur, textureHauteur, THREE.RGBAFormat);
    textureRecolor.flipY = false;
    textureRecolor.encoding = THREE.sRGBEncoding;
  } else {
    textureRecolor.image.data.set(data);
    textureRecolor.needsUpdate = true;
  }
  bikeMeshes.forEach(m => {
    if (m.material && m.material.map) {
      m.material.map = textureRecolor;
      m.material.needsUpdate = true;
    }
  });
}

function extraireTextureOriginale(material) {
  if (!material.map || !material.map.image) return;
  const img = material.map.image;
  const canvas = document.createElement('canvas');
  canvas.width = img.width || img.naturalWidth;
  canvas.height = img.height || img.naturalHeight;
  textureLargeur = canvas.width;
  textureHauteur = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  pixelsOriginaux = new Uint8ClampedArray(imgData.data);
  textureOriginale = material.map;
}

function base64ToArrayBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;

const loader = new THREE.GLTFLoader();
const arrayBuffer = base64ToArrayBuffer(MOTO_BASE64);
loader.parse(arrayBuffer, '', (gltf) => {
  bikeModel = gltf.scene;

  const box1 = new THREE.Box3().setFromObject(bikeModel);
  const size1 = box1.getSize(new THREE.Vector3());
  const maxDim = Math.max(size1.x, size1.y, size1.z);
  bikeModel.scale.setScalar(2.0 / maxDim);
  bikeModel.updateMatrixWorld(true);

  const box2 = new THREE.Box3().setFromObject(bikeModel);
  const center2 = box2.getCenter(new THREE.Vector3());
  bikeModel.position.x -= center2.x;
  bikeModel.position.z -= center2.z;
  bikeModel.updateMatrixWorld(true);

  bikeBounds = new THREE.Box3().setFromObject(bikeModel);
  initialiserEtages();
  bikeMeshes = [];
  bikeModel.traverse(o => {
    if (o.isMesh && o.material) {
      o.material = o.material.clone();
      bikeMeshes.push(o);
      if (!pixelsOriginaux && o.material.map) extraireTextureOriginale(o.material);
    }
  });

  assemblage.add(bikeModel);
  loadingEl.style.display = 'none';
  document.getElementById('btnExport').disabled = false;
  appliquerCouleursCarrosserie();
  catalogReady.then(() => {
    construireAddons();
    rafraichirAddons();
    enregistrerHistorique();
  });
}, (err) => {
  loadingEl.textContent = 'Erreur de chargement : ' + err.message;
});

function creerMateriau(couleur, emissif) {
  const c = new THREE.Color(couleur);
  if (emissif) {
    return new THREE.MeshStandardMaterial({ color: c, emissive: c.clone(), emissiveIntensity: 2.2, roughness: 0.3, metalness: 0.1 });
  }
  return new THREE.MeshStandardMaterial({ color: c, roughness: 0.4, metalness: 0.35 });
}

function creerTrianglePlat(largeur, hauteur, epaisseur, couleur, emissif) {
  const s = new THREE.Shape();
  s.moveTo(-largeur / 2, 0);
  s.lineTo(largeur / 2, 0);
  s.lineTo(0, hauteur);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: epaisseur, bevelEnabled: false });
  g.center();
  return new THREE.Mesh(g, creerMateriau(couleur, emissif));
}

function creerCroix(largeur, epaisseur, profondeur, couleur, emissif) {
  const t = largeur * 0.28;
  const s = new THREE.Shape();
  s.moveTo(-t, -largeur); s.lineTo(t, -largeur); s.lineTo(t, -t); s.lineTo(largeur, -t);
  s.lineTo(largeur, t); s.lineTo(t, t); s.lineTo(t, largeur); s.lineTo(-t, largeur);
  s.lineTo(-t, t); s.lineTo(-largeur, t); s.lineTo(-largeur, -t); s.lineTo(-t, -t);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: profondeur, bevelEnabled: false });
  g.center();
  return new THREE.Mesh(g, creerMateriau(couleur, emissif));
}

function creerEtoile(rayon, epaisseur, couleur, emissif) {
  const s = new THREE.Shape();
  const branches = 5;
  for (let i = 0; i < branches * 2; i++) {
    const r = i % 2 === 0 ? rayon : rayon * 0.42;
    const a = (i / (branches * 2)) * Math.PI * 2 - Math.PI / 2;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
  }
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: epaisseur, bevelEnabled: false });
  g.center();
  return new THREE.Mesh(g, creerMateriau(couleur, emissif));
}

function creerChevron(largeur, hauteur, epaisseur, couleur, emissif) {
  const s = new THREE.Shape();
  const t = Math.max(epaisseur * 2.5, largeur * 0.18);
  s.moveTo(-largeur / 2, hauteur / 2);
  s.lineTo(0, -hauteur / 2);
  s.lineTo(largeur / 2, hauteur / 2);
  s.lineTo(largeur / 2 - t, hauteur / 2 - t * 0.9);
  s.lineTo(0, -hauteur / 2 + t * 1.4);
  s.lineTo(-largeur / 2 + t, hauteur / 2 - t * 0.9);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: epaisseur, bevelEnabled: false });
  g.center();
  return new THREE.Mesh(g, creerMateriau(couleur, emissif));
}

function creerLosange(largeur, hauteur, epaisseur, couleur, emissif) {
  const s = new THREE.Shape();
  s.moveTo(0, hauteur / 2);
  s.lineTo(largeur / 2, 0);
  s.lineTo(0, -hauteur / 2);
  s.lineTo(-largeur / 2, 0);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: epaisseur, bevelEnabled: false });
  g.center();
  return new THREE.Mesh(g, creerMateriau(couleur, emissif));
}

function creerFleche(longueur, largeur, epaisseur, couleur, emissif) {
  const s = new THREE.Shape();
  const t = largeur * 0.35;
  s.moveTo(longueur / 2, 0);
  s.lineTo(t, largeur / 2);
  s.lineTo(t, largeur * 0.15);
  s.lineTo(-longueur / 2, largeur * 0.15);
  s.lineTo(-longueur / 2, -largeur * 0.15);
  s.lineTo(t, -largeur * 0.15);
  s.lineTo(t, -largeur / 2);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: epaisseur, bevelEnabled: false });
  g.center();
  return new THREE.Mesh(g, creerMateriau(couleur, emissif));
}

function creerDemiCercle(rayon, epaisseur, couleur, emissif) {
  const s = new THREE.Shape();
  s.absarc(0, 0, rayon, 0, Math.PI, false);
  s.lineTo(-rayon, 0);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: epaisseur, bevelEnabled: false });
  g.center();
  return new THREE.Mesh(g, creerMateriau(couleur, emissif));
}

function creerCadreCarre(taille, barre, profondeur, couleur, emissif) {
  const s = new THREE.Shape();
  const h = barre;
  s.moveTo(-taille, -taille); s.lineTo(taille, -taille); s.lineTo(taille, taille); s.lineTo(-taille, taille); s.closePath();
  const trou = new THREE.Path();
  trou.moveTo(-taille + h, -taille + h); trou.lineTo(taille - h, -taille + h);
  trou.lineTo(taille - h, taille - h); trou.lineTo(-taille + h, taille - h); trou.closePath();
  s.holes.push(trou);
  const g = new THREE.ExtrudeGeometry(s, { depth: profondeur, bevelEnabled: false });
  g.center();
  return new THREE.Mesh(g, creerMateriau(couleur, emissif));
}

function creerZigzag(largeur, amplitude, epaisseur, couleur, emissif) {
  const s = new THREE.Shape();
  const steps = 5;
  const w = largeur / steps;
  s.moveTo(-largeur / 2, amplitude / 2);
  for (let i = 0; i < steps; i++) {
    s.lineTo(-largeur / 2 + (i + 0.5) * w, -amplitude / 2);
    s.lineTo(-largeur / 2 + (i + 1) * w, amplitude / 2);
  }
  s.lineTo(largeur / 2, amplitude / 2 - epaisseur * 2);
  for (let i = steps - 1; i >= 0; i--) {
    s.lineTo(-largeur / 2 + (i + 0.5) * w, -amplitude / 2 + epaisseur * 2);
    s.lineTo(-largeur / 2 + i * w, amplitude / 2 - epaisseur * 2);
  }
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: epaisseur, bevelEnabled: false });
  g.center();
  return new THREE.Mesh(g, creerMateriau(couleur, emissif));
}

function creerDoubleChevron(largeur, hauteur, epaisseur, couleur, emissif) {
  const s = new THREE.Shape();
  const t = largeur * 0.14;
  const gap = largeur * 0.08;
  [[-gap, 0], [gap, 0]].forEach(([ox]) => {
    const x0 = ox - largeur / 4;
    s.moveTo(x0 - largeur / 4, hauteur / 2);
    s.lineTo(x0, -hauteur / 2);
    s.lineTo(x0 + largeur / 4, hauteur / 2);
    s.lineTo(x0 + largeur / 4 - t, hauteur / 2 - t);
    s.lineTo(x0, -hauteur / 2 + t * 1.2);
    s.lineTo(x0 - largeur / 4 + t, hauteur / 2 - t);
    s.closePath();
  });
  const g = new THREE.ExtrudeGeometry(s, { depth: epaisseur, bevelEnabled: false });
  g.center();
  return new THREE.Mesh(g, creerMateriau(couleur, emissif));
}

function creerAileMesh(opts) {
  const {
    envergure, cordeRacine, couleur, emissif,
    spanSign = 1, type = 'avion',
  } = opts;
  const spanSeg = type === 'empennage' ? 14 : 24;
  const chordSeg = 16;
  const positions = [];
  const indices = [];
  let vi = 0;
  const upperIdx = [];
  const lowerIdx = [];

  function addVert(x, y, z) {
    positions.push(x, y, z);
    return vi++;
  }

  function epaisseurNaca(u, c, mul) {
    const yt = mul * c * (0.2969 * Math.sqrt(Math.max(u, 1e-4)) - 0.126 * u - 0.3516 * u * u + 0.2843 * u * u * u - 0.1015 * u * u * u * u);
    return Math.max(yt, c * 0.005);
  }

  for (let si = 0; si <= spanSeg; si++) {
    const t = si / spanSeg;
    let taper, sweep, dihedral, twist, camberMul, thickMul, z;

    if (type === 'avion') {
      taper = 1 - t * 0.7;
      sweep = t * cordeRacine * 0.5;
      dihedral = t * cordeRacine * 0.16;
      twist = -t * 0.14;
      camberMul = 0.1;
      thickMul = 0.042;
    } else if (type === 'oiseau') {
      taper = Math.sqrt(Math.max(0.015, 1 - t * t * 0.94));
      sweep = t * t * cordeRacine * 0.58;
      dihedral = t * cordeRacine * 0.26 + Math.sin(t * Math.PI) * cordeRacine * 0.1;
      twist = -t * 0.22;
      camberMul = 0.2;
      thickMul = 0.055;
    } else if (type === 'oiseauDeploy') {
      taper = Math.sqrt(Math.max(0.02, 1 - t * t * 0.88));
      sweep = t * cordeRacine * 0.35;
      dihedral = t * cordeRacine * 0.12;
      twist = -t * 0.08;
      camberMul = 0.16;
      thickMul = 0.048;
    } else if (type === 'chasse') {
      taper = 1 - t * 0.78;
      sweep = t * cordeRacine * 0.72;
      dihedral = t * cordeRacine * 0.08;
      twist = -t * 0.08;
      camberMul = 0.06;
      thickMul = 0.032;
    } else if (type === 'albatros') {
      taper = Math.sqrt(Math.max(0.008, 1 - t * t * 0.97));
      sweep = t * t * cordeRacine * 0.42;
      dihedral = t * cordeRacine * 0.1;
      twist = -t * 0.06;
      camberMul = 0.06;
      thickMul = 0.022;
    } else if (type === 'aigle') {
      taper = Math.pow(Math.max(0.01, 1 - t * 0.92), 1.4);
      sweep = t * t * cordeRacine * 0.62;
      dihedral = t * cordeRacine * 0.2 + Math.sin(t * Math.PI) * cordeRacine * 0.12;
      twist = -t * 0.25;
      camberMul = 0.24;
      thickMul = 0.058;
    } else {
      taper = 1 - t * 0.42;
      sweep = t * cordeRacine * 0.22;
      dihedral = 0;
      twist = 0;
      camberMul = 0.05;
      thickMul = 0.028;
    }

    const c = cordeRacine * taper;
    if (type === 'empennage') {
      z = (t - 0.5) * 2 * envergure;
    } else {
      z = spanSign * t * envergure;
    }
    upperIdx[si] = [];
    lowerIdx[si] = [];

    for (let ci = 0; ci <= chordSeg; ci++) {
      const u = ci / chordSeg;
      let x = u * c * 0.9 + sweep - c * 0.06;
      const camber = camberMul * c * Math.sin(u * Math.PI) + dihedral;
      const thick = epaisseurNaca(u, c, thickMul);
      let yU = camber + thick;
      let yL = camber - thick * (type === 'oiseau' || type === 'oiseauDeploy' || type === 'aigle' ? 0.62 : 0.48);

      if (type === 'oiseau' || type === 'oiseauDeploy' || type === 'aigle') {
        const arc = Math.sin(u * Math.PI) * c * (type === 'aigle' ? 0.1 : 0.07);
        x += arc * (1 - t * 0.5);
      }

      const pivotX = sweep;
      const dxU = x - pivotX;
      const dyU = yU - dihedral;
      const dxL = x - pivotX;
      const dyL = yL - dihedral;
      const cosT = Math.cos(twist);
      const sinT = Math.sin(twist);
      const xU = dxU * cosT - dyU * sinT + pivotX;
      const yUpper = dxU * sinT + dyU * cosT + dihedral;
      const xL = dxL * cosT - dyL * sinT + pivotX;
      const yLower = dxL * sinT + dyL * cosT + dihedral;

      upperIdx[si][ci] = addVert(xU, yUpper, z);
      lowerIdx[si][ci] = addVert(xL, yLower, z);
    }
  }

  function quad(a, b, c, d, flip) {
    if (flip) indices.push(a, b, c, b, d, c);
    else indices.push(a, c, b, b, c, d);
  }

  for (let si = 0; si < spanSeg; si++) {
    for (let ci = 0; ci < chordSeg; ci++) {
      quad(upperIdx[si][ci], upperIdx[si][ci + 1], upperIdx[si + 1][ci], upperIdx[si + 1][ci + 1], false);
      quad(lowerIdx[si][ci], lowerIdx[si + 1][ci], lowerIdx[si][ci + 1], lowerIdx[si + 1][ci + 1], false);
    }
    quad(upperIdx[si][0], lowerIdx[si][0], upperIdx[si + 1][0], lowerIdx[si + 1][0], false);
    const cc = chordSeg;
    quad(upperIdx[si][cc], upperIdx[si + 1][cc], lowerIdx[si][cc], lowerIdx[si + 1][cc], false);
  }

  const tip = spanSeg;
  for (let ci = 0; ci < chordSeg; ci++) {
    quad(upperIdx[tip][ci], upperIdx[tip][ci + 1], lowerIdx[tip][ci], lowerIdx[tip][ci + 1], false);
  }

  if (opts.winglet && type !== 'empennage') {
    const ciW = Math.floor(chordSeg * 0.55);
    const hW = cordeRacine * 0.32;
    const lean = cordeRacine * 0.08;
    [[upperIdx[tip][ciW], upperIdx[tip][ciW + 2]], [upperIdx[tip][chordSeg - 1], upperIdx[tip][chordSeg]]].forEach(([i0, i1]) => {
      const x0 = positions[i0 * 3], y0 = positions[i0 * 3 + 1], z0 = positions[i0 * 3 + 2];
      const x1 = positions[i1 * 3], y1 = positions[i1 * 3 + 1], z1 = positions[i1 * 3 + 2];
      const a = addVert(x0, y0, z0);
      const b = addVert(x1, y1, z1);
      const c = addVert(x0 + lean, y0 + hW, z0);
      const d = addVert(x1 + lean * 0.6, y1 + hW * 0.88, z1);
      quad(a, b, c, d, false);
      quad(b, a, d, c, false);
    });
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  const mesh = new THREE.Mesh(geom, creerMateriau(couleur, emissif));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function fusionnerGeometries(geometries) {
  const positions = [];
  const indices = [];
  let offset = 0;
  geometries.forEach((g) => {
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) positions.push(p.getX(i), p.getY(i), p.getZ(i));
    if (g.index) {
      for (let i = 0; i < g.index.count; i++) indices.push(g.index.getX(i) + offset);
    }
    offset += p.count;
  });
  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  if (indices.length) merged.setIndex(indices);
  merged.computeVertexNormals();
  return merged;
}

function creerAileBiplan(opts) {
  const { envergure, cordeRacine, couleur, emissif, spanSign = 1 } = opts;
  const gap = cordeRacine * 0.2;
  const lower = creerAileMesh({ ...opts, type: 'avion' }).geometry;
  const upper = creerAileMesh({ ...opts, type: 'avion' }).geometry;
  lower.translate(0, -gap * 0.35, 0);
  upper.translate(0, gap, 0);
  const struts = [];
  [0.22, 0.52, 0.82].forEach((t) => {
    const sg = new THREE.BoxGeometry(0.014, gap * 1.35, 0.014);
    sg.translate(cordeRacine * 0.32, gap * 0.3, spanSign * envergure * t);
    struts.push(sg);
  });
  const geom = fusionnerGeometries([lower, upper, ...struts]);
  return new THREE.Mesh(geom, creerMateriau(couleur, emissif));
}

function creerAileChauveSouris(opts) {
  const { envergure, cordeRacine, couleur, emissif, spanSign = -1 } = opts;
  const positions = [];
  const indices = [];
  let vi = 0;
  const fingers = 5;
  const spanSeg = 20;
  const fingerPaths = [];

  for (let fi = 0; fi < fingers; fi++) {
    const ft = fi / (fingers - 1);
    const fingerLen = envergure * (0.32 + ft * 0.68);
    const path = [];
    for (let si = 0; si <= spanSeg; si++) {
      const t = si / spanSeg;
      const z = spanSign * t * fingerLen;
      const x = cordeRacine * (0.1 + ft * 0.52) * (1 - t * 0.55) + t * cordeRacine * 0.18 * ft;
      const y = -t * t * cordeRacine * 0.45 * (0.45 + ft * 0.55)
        + Math.sin(t * Math.PI * 0.85) * cordeRacine * 0.07;
      path.push({ x, y, z });
    }
    fingerPaths.push(path);
  }

  function addVert(v) {
    positions.push(v.x, v.y, v.z);
    return vi++;
  }
  function quad(a, b, c, d) {
    indices.push(a, c, b, b, c, d);
  }

  for (let fi = 0; fi < fingers - 1; fi++) {
    for (let si = 0; si < spanSeg; si++) {
      const va = addVert(fingerPaths[fi][si]);
      const vb = addVert(fingerPaths[fi + 1][si]);
      const vc = addVert(fingerPaths[fi][si + 1]);
      const vd = addVert(fingerPaths[fi + 1][si + 1]);
      quad(va, vb, vc, vd);
    }
  }

  const root = { x: -cordeRacine * 0.06, y: 0, z: 0 };
  const r = addVert(root);
  for (let fi = 0; fi < fingers - 1; fi++) {
    const a = addVert(fingerPaths[fi][0]);
    const b = addVert(fingerPaths[fi + 1][0]);
    indices.push(r, a, b);
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  const mat = creerMateriau(couleur, emissif);
  mat.side = THREE.DoubleSide;
  return new THREE.Mesh(geom, mat);
}

function creerAilePapillon(opts) {
  const { envergure, cordeRacine, couleur, emissif, spanSign = -1 } = opts;
  const w = cordeRacine * 0.95;
  const h = envergure * 0.88;
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(w * 0.45, h * 0.55, w * 0.85, h * 1.05, w * 0.22, h * 0.82);
  s.bezierCurveTo(w * 0.55, h * 0.5, w * 0.2, h * 0.12, 0, 0);
  s.bezierCurveTo(w * 0.18, -h * 0.1, w * 0.55, -h * 0.45, w * 0.2, -h * 0.82);
  s.bezierCurveTo(w * 0.75, -h * 0.55, w * 0.4, -h * 0.15, 0, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.008, bevelEnabled: false });
  g.center();
  if (spanSign < 0) g.scale(-1, 1, 1);
  const mat = creerMateriau(couleur, emissif);
  mat.side = THREE.DoubleSide;
  return new THREE.Mesh(g, mat);
}

function ajouterPiece(id, mesh) {
  const def = ADDONS_CATALOG.find(a => a.id === id);
  const pivot = new THREE.Group();
  const pos = mesh.position.clone();
  const rot = mesh.rotation.clone();
  mesh.position.set(0, 0, 0);
  mesh.rotation.set(0, 0, 0);
  pivot.position.copy(pos);
  pivot.rotation.copy(rot);
  pivot.add(mesh);
  pivot.visible = false;
  pivot.name = 'pivot-' + id;
  mesh.name = id;
  addons[id] = {
    id,
    pivot,
    mesh,
    emissive: def ? def.emissive : false,
    basePosition: pos.clone(),
    baseRotation: new THREE.Euler().copy(rot),
    colle: true,
    flotter: false,
    scaleMul: 1,
    etage: 0,
  };
  assemblage.add(pivot);
}

function rafraichirAddons() {
  const echelle = parseFloat(document.getElementById('echelleAddons').value);
  ADDONS_CATALOG.forEach(a => {
    const addon = addons[a.id];
    if (!addon) return;
    const chk = document.getElementById('chk-' + a.id);
    const col = document.getElementById('col-' + a.id);
    addon.pivot.visible = chk && chk.checked;
    const s = echelle * addon.scaleMul;
    addon.mesh.scale.setScalar(s);
    if (col) {
      addon.mesh.material.color.set(col.value);
      if (addon.emissive && addon.mesh.material.emissive) {
        addon.mesh.material.emissive.set(col.value);
      }
    }
  });
  if (pieceSelectionnee) mettreAJourHelperSelection();
}

// ---------------------------------------------------------------------
// Historique undo / redo
// ---------------------------------------------------------------------
const historique = { stack: [], index: -1, max: 50 };
let historiqueSuspendu = false;

function capturerEtat() {
  const state = { addons: {}, materials: {}, echelle: 1 };
  const echelleEl = document.getElementById('echelleAddons');
  if (echelleEl) state.echelle = parseFloat(echelleEl.value);
  ADDONS_CATALOG.forEach(a => {
    const chk = document.getElementById('chk-' + a.id);
    const col = document.getElementById('col-' + a.id);
    const addon = addons[a.id];
    if (!addon) return;
    state.addons[a.id] = {
      visible: !!(chk && chk.checked),
      color: col ? col.value : a.color,
      position: addon.pivot.position.toArray(),
      rotation: [addon.pivot.rotation.x, addon.pivot.rotation.y, addon.pivot.rotation.z],
      scaleMul: addon.scaleMul,
      colle: addon.colle,
      etage: addon.etage,
    };
  });
  COULEURS_CARROSSERIE.forEach(c => {
    const el = document.getElementById('col-' + c.id);
    if (el) state.materials[c.id] = el.value;
  });
  return state;
}

function restaurerEtat(state) {
  if (!state) return;
  historiqueSuspendu = true;
  ADDONS_CATALOG.forEach(a => {
    const s = state.addons[a.id];
    const addon = addons[a.id];
    if (!s || !addon) return;
    const chk = document.getElementById('chk-' + a.id);
    const col = document.getElementById('col-' + a.id);
    if (chk) chk.checked = s.visible;
    if (col) col.value = s.color;
    addon.pivot.position.fromArray(s.position);
    addon.pivot.rotation.set(s.rotation[0], s.rotation[1], s.rotation[2]);
    addon.scaleMul = s.scaleMul;
    addon.colle = s.colle;
    addon.flotter = !s.colle;
    addon.etage = s.etage;
  });
  Object.entries(state.materials || {}).forEach(([zone, hex]) => {
    const el = document.getElementById('col-' + zone);
    if (el) el.value = hex;
  });
  const echelleEl = document.getElementById('echelleAddons');
  if (echelleEl && state.echelle) {
    echelleEl.value = state.echelle;
    document.getElementById('v-echelleAddons').textContent = state.echelle;
  }
  appliquerCouleursCarrosserie();
  rafraichirAddons();
  Object.values(addons).forEach(a => { if (a.colle && a.pivot.visible) collerSurMoto(a.pivot); });
  historiqueSuspendu = false;
  mettreAJourBoutonsHistorique();
}

function enregistrerHistorique() {
  if (historiqueSuspendu || !bikeModel) return;
  const snap = capturerEtat();
  historique.stack = historique.stack.slice(0, historique.index + 1);
  historique.stack.push(snap);
  if (historique.stack.length > historique.max) historique.stack.shift();
  historique.index = historique.stack.length - 1;
  mettreAJourBoutonsHistorique();
}

function mettreAJourBoutonsHistorique() {
  const undo = document.getElementById('btnUndo');
  const redo = document.getElementById('btnRedo');
  if (undo) undo.disabled = historique.index <= 0;
  if (redo) redo.disabled = historique.index >= historique.stack.length - 1;
}

function annuler() {
  if (historique.index <= 0) return;
  historique.index--;
  restaurerEtat(historique.stack[historique.index]);
}

function refaire() {
  if (historique.index >= historique.stack.length - 1) return;
  historique.index++;
  restaurerEtat(historique.stack[historique.index]);
}

function idMiroir(id) {
  if (id.endsWith('G')) return id.slice(0, -1) + 'D';
  if (id.endsWith('D')) return id.slice(0, -1) + 'G';
  return null;
}

function dupliquerMiroir() {
  if (!pieceSelectionnee) return;
  const srcId = pieceSelectionnee;
  const dstId = idMiroir(srcId);
  if (!dstId || !addons[dstId]) return;
  enregistrerHistorique();
  const src = addons[srcId];
  const dst = addons[dstId];
  const chk = document.getElementById('chk-' + dstId);
  const col = document.getElementById('col-' + srcId);
  const colDst = document.getElementById('col-' + dstId);
  if (chk) chk.checked = true;
  if (col && colDst) colDst.value = col.value;
  const cz = bikeBounds ? (bikeBounds.min.z + bikeBounds.max.z) / 2 : 0;
  dst.pivot.position.set(src.pivot.position.x, src.pivot.position.y, 2 * cz - src.pivot.position.z);
  dst.pivot.rotation.set(src.pivot.rotation.x, -src.pivot.rotation.y, -src.pivot.rotation.z);
  dst.scaleMul = src.scaleMul;
  dst.colle = src.colle;
  dst.flotter = src.flotter;
  dst.etage = src.etage;
  rafraichirAddons();
  if (dst.colle) collerSurMoto(dst.pivot);
  selectionnerPiece(dstId);
}

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); annuler(); }
  if (e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) { e.preventDefault(); refaire(); }
});

function lirePresetsLocaux() {
  try { return JSON.parse(localStorage.getItem('assembleur_presets') || '[]'); }
  catch { return []; }
}

function sauvegarderPresetLocal(nom) {
  const presets = lirePresetsLocaux();
  presets.push({ id: 'local_' + Date.now(), name: nom, config: construireConfigExport(), local: true });
  localStorage.setItem('assembleur_presets', JSON.stringify(presets));
  remplirPresets();
}

function remplirPresets() {
  const liste = document.getElementById('presetsListe');
  if (!liste) return;
  liste.innerHTML = '';
  const all = [...(presetsData.presets || []), ...lirePresetsLocaux()];
  all.forEach(p => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-action secondaire preset-btn';
    btn.textContent = p.name + (p.local ? ' ★' : '');
    btn.title = p.description || '';
    btn.addEventListener('click', () => {
      enregistrerHistorique();
      if (p.config.parts && p.config.parts[0] && p.config.parts[0].socket) {
        appliquerAssemblageIA(p.config);
      } else {
        appliquerConfigComplete(p.config);
      }
    });
    liste.appendChild(btn);
  });
}

function appliquerConfigComplete(config) {
  if (!config) return { success: false, errors: ['Config vide'] };
  ADDONS_CATALOG.forEach(a => {
    const chk = document.getElementById('chk-' + a.id);
    if (chk) chk.checked = false;
  });
  deselectionnerPiece();
  const echelleGlob = config.echelleAddons || 1;
  const echelleEl = document.getElementById('echelleAddons');
  if (echelleEl) {
    echelleEl.value = echelleGlob;
    document.getElementById('v-echelleAddons').textContent = echelleGlob;
  }
  (config.parts || []).forEach(p => {
    const id = p.object || p.id;
    const addon = addons[id];
    if (!addon) return;
    const chk = document.getElementById('chk-' + id);
    const col = document.getElementById('col-' + id);
    if (chk) chk.checked = p.enabled !== false;
    if (col && p.color) col.value = p.color.startsWith('#') ? p.color : (catalogData?.colors[p.color] || p.color);
    if (p.position) addon.pivot.position.set(p.position.x, p.position.y, p.position.z);
    if (p.rotation) addon.pivot.rotation.set(p.rotation.x, p.rotation.y, p.rotation.z);
    addon.scaleMul = p.scaleMul != null ? p.scaleMul : (p.scale || 1);
    addon.colle = p.colle !== false;
    addon.flotter = !addon.colle;
    addon.etage = p.etage != null ? p.etage : etageLePlusProche(addon.pivot.position.y);
  });
  Object.entries(config.materials || config.materialColors || {}).forEach(([zone, hex]) => {
    const el = document.getElementById('col-' + zone);
    if (el) el.value = hex.startsWith('#') ? hex : (catalogData?.colors[hex] || hex);
  });
  appliquerCouleursCarrosserie();
  rafraichirAddons();
  Object.values(addons).forEach(a => { if (a.colle && a.pivot.visible) collerSurMoto(a.pivot); });
  return { success: true };
}

// ---------------------------------------------------------------------
// Export .glb — ancres sémantiques + config embarquée
// ---------------------------------------------------------------------
let exportAnchorsGroup = null;

function anchorToWorld(anchorNorm) {
  const min = bikeBounds.min, max = bikeBounds.max;
  const size = bikeBounds.getSize(new THREE.Vector3());
  return new THREE.Vector3(
    min.x + size.x * anchorNorm.x,
    min.y + size.y * anchorNorm.y,
    min.z + size.z * anchorNorm.z
  );
}

function mettreAJourAncresExport() {
  if (!bikeBounds || !catalogData) return;
  const anchorsDef = catalogData.bases?.bike_base?.exportAnchors;
  if (!anchorsDef) return;
  if (exportAnchorsGroup) assemblage.remove(exportAnchorsGroup);
  exportAnchorsGroup = new THREE.Group();
  exportAnchorsGroup.name = 'export_anchors';
  Object.entries(anchorsDef).forEach(([name, def]) => {
    const node = new THREE.Object3D();
    node.name = name;
    node.position.copy(anchorToWorld(def.anchor));
    exportAnchorsGroup.add(node);
  });
  assemblage.add(exportAnchorsGroup);
}

function construireConfigExport() {
  const echelle = parseFloat(document.getElementById('echelleAddons')?.value || '1');
  const parts = [];
  ADDONS_CATALOG.forEach(a => {
    const chk = document.getElementById('chk-' + a.id);
    if (!chk || !chk.checked) return;
    const addon = addons[a.id];
    if (!addon) return;
    const col = document.getElementById('col-' + a.id);
    parts.push({
      object: a.id,
      enabled: true,
      position: { x: addon.pivot.position.x, y: addon.pivot.position.y, z: addon.pivot.position.z },
      rotation: { x: addon.pivot.rotation.x, y: addon.pivot.rotation.y, z: addon.pivot.rotation.z },
      scaleMul: addon.scaleMul,
      scale: addon.scaleMul * echelle,
      color: col ? col.value : a.color,
      colle: addon.colle,
      etage: addon.etage,
    });
  });
  const materials = {};
  COULEURS_CARROSSERIE.forEach(c => {
    const el = document.getElementById('col-' + c.id);
    if (el) materials[c.id] = el.value;
  });
  return {
    version: 1,
    base: 'bike_base',
    assetId: (document.getElementById('nomFichier')?.value || 'ma-moto-custom').trim(),
    echelleAddons: echelle,
    parts,
    materials,
    bounds: boundsToPlain(),
    exportAnchors: Object.keys(catalogData?.bases?.bike_base?.exportAnchors || {}),
  };
}

function preparerExportGlb() {
  mettreAJourAncresExport();
  assemblage.name = 'assemblage';
  assemblage.userData.assembleurConfig = construireConfigExport();
  assemblage.userData.generator = '3D-editor-assembleur-v3';
}

// ---------------------------------------------------------------------
// Export .glb
// ---------------------------------------------------------------------
function exporterGlb() {
  preparerExportGlb();
  const exporter = new THREE.GLTFExporter();
  const nom = (document.getElementById('nomFichier').value || 'moto-custom').trim();
  exporter.parse(assemblage, (result) => {
    const blob = new Blob([result], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nom.endsWith('.glb') ? nom : nom + '.glb';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, { binary: true, onlyVisible: true });
}

function exporterGlbPromise() {
  return new Promise((resolve, reject) => {
    if (!assemblage) return reject(new Error('Scène non prête'));
    try {
      preparerExportGlb();
      const exporter = new THREE.GLTFExporter();
      exporter.parse(assemblage, (result) => {
        if (!result) return reject(new Error('Export GLB vide'));
        resolve(new Blob([result], { type: 'model/gltf-binary' }));
      }, { binary: true, onlyVisible: true });
    } catch (err) {
      reject(err);
    }
  });
}

async function assemblerEtExporterGlb(config) {
  const asm = appliquerAssemblageIA(config);
  if (!asm.success) return asm;
  try {
    const blob = await exporterGlbPromise();
    return { ...asm, blob };
  } catch (err) {
    return { success: false, errors: [err.message || String(err)] };
  }
}

// ---------------------------------------------------------------------
// API IA — catalogue, validation, assemblage par sockets
// ---------------------------------------------------------------------
let catalogData = null;

const catalogReady = fetch('catalog.json').then(r => r.json()).then(c => {
  catalogData = c;
  ADDONS_CATALOG = buildAddonsCatalog(c);
  return c;
}).catch(err => {
  console.warn('Catalogue non chargé:', err);
  return null;
});

const presetsReady = fetch('presets.json').then(r => r.json()).then(p => {
  presetsData = p;
  return p;
}).catch(() => ({ presets: [] }));

Promise.all([catalogReady, presetsReady]).then(([cat]) => {
  if (cat) construirePanneau();
});

function boundsToPlain() {
  if (!bikeBounds) return null;
  return {
    min: { x: bikeBounds.min.x, y: bikeBounds.min.y, z: bikeBounds.min.z },
    max: { x: bikeBounds.max.x, y: bikeBounds.max.y, z: bikeBounds.max.z }
  };
}

function appliquerAssemblageIA(config) {
  if (!catalogData) return { success: false, errors: ['Catalogue non chargé'] };
  if (!bikeBounds) return { success: false, errors: ['Modèle base non chargé'] };
  const bounds = boundsToPlain();
  const result = AssemblerEngine.assembleAsset(config, catalogData, bounds);
  if (!result.success) return result;

  ADDONS_CATALOG.forEach(a => {
    const chk = document.getElementById('chk-' + a.id);
    if (chk) chk.checked = false;
  });
  deselectionnerPiece();

  result.parts.forEach(p => {
    const addon = addons[p.id];
    if (!addon) return;
    const chk = document.getElementById('chk-' + p.id);
    const col = document.getElementById('col-' + p.id);
    if (chk) chk.checked = true;
    if (col) col.value = p.color;
    addon.pivot.position.set(p.position.x, p.position.y, p.position.z);
    addon.pivot.rotation.set(p.rotation.x, p.rotation.y, p.rotation.z);
    addon.scaleMul = p.scale;
    addon.colle = p.colle;
    addon.etage = etageLePlusProche(p.position.y);
    addon.basePosition.copy(addon.pivot.position);
    addon.baseRotation.copy(addon.pivot.rotation);
  });

  Object.entries(result.materialColors || {}).forEach(([zone, hex]) => {
    const el = document.getElementById('col-' + zone);
    if (el) el.value = hex;
  });

  appliquerCouleursCarrosserie();
  rafraichirAddons();
  return result;
}

window.AssembleurAPI = {
  isReady: () => !!(catalogData && bikeModel && ADDONS_CATALOG.length),
  getCatalog: () => catalogData ? AssemblerEngine.getCatalog(catalogData) : null,
  getRawCatalog: () => catalogData,
  getPresets: () => presetsData,
  getBounds: () => boundsToPlain(),
  getExportConfig: () => construireConfigExport(),
  validate: (config) => {
    if (!catalogData) return { success: false, errors: ['Catalogue non chargé'] };
    return AssemblerEngine.validateConfig(config, catalogData);
  },
  assemble: (config) => appliquerAssemblageIA(config),
  applyConfig: (config) => appliquerConfigComplete(config),
  assembleAndExport: (config) => assemblerEtExporterGlb(config),
  exportGlb: () => exporterGlbPromise(),
  exemple: () => ({
    base: 'bike_base',
    assetId: 'preset_exemple',
    parts: [
      { object: 'spoiler', socket: 'rearCenter' },
      { object: 'aileronG', socket: 'leftSideRear', color: 'cyan' },
      { object: 'aileronD', socket: 'rightSideRear', color: 'cyan' },
      { object: 'liseret', socket: 'neonSide', color: 'cyan' },
      { object: 'antenne', socket: 'antennaRear', color: 'magenta' }
    ],
    materials: { rouge: 'black', blanc: 'white', noir: 'black', chrome: 'chrome' }
  }),
  presetAiles: () => ({
    base: 'bike_base',
    assetId: 'preset_ailes',
    parts: [
      { object: 'aileAvionG', socket: 'wingRootLeft', color: 'white' },
      { object: 'aileAvionD', socket: 'wingRootRight', color: 'white' },
      { object: 'empennageAvion', socket: 'empennageRear', color: 'white' },
      { object: 'spoiler', socket: 'rearCenter', color: 'dark' }
    ],
    materials: { rouge: 'red', blanc: 'white', noir: 'black', chrome: 'chrome' }
  })
};

console.info('AssembleurAPI disponible — ex: AssembleurAPI.assemble(AssembleurAPI.exemple())');
