services:
  assembleur:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8765:8765"
    environment:
      PORT: "8765"
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y -qq python3 libgbm1 libasound2 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgtk-3-0 libpango-1.0-0 libcairo2 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxshmfence1 &&
        npm install --silent &&
        python3 api-server.py
      "
